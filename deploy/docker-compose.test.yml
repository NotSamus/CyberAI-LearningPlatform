# A Postgres for the test suite only (test/conftest.py). The tests never reach the platform's own
# database, on this computer or on the server: they make a throwaway database here for each run and
# drop it afterwards. It keeps its data in memory, so nothing is left when it stops.
#   ./check.sh starts and stops it; by hand: docker compose -f deploy/docker-compose.test.yml up -d --wait
name: cyberai-test

services:
  db:
    image: postgres:16              # the same major version as production and dev
    ports: ["127.0.0.1:5434:5432"]  # 5433 is the dev database: the tests must never be pointed there
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: postgres
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "test", "-d", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

# Python lint: ruff check api test grader deploy (./check.sh runs it). Chosen to catch mistakes, not
# to change how the code is laid out:
#   F      pyflakes: names that are not defined, imports and variables that are not used
#   E4, E7, E9  pycodestyle's errors: imports in the wrong place, statements that cannot be right
#   B      flake8-bugbear: mutable defaults, loop variables caught in closures, asserts that never fail
#   ASYNC  blocking calls inside async functions (the hub and grader clients are async)
#   RUF100 noqa comments that no longer silence anything
line-length = 160
target-version = "py311"

[lint]
select = ["F", "E4", "E7", "E9", "B", "ASYNC", "RUF100"]
ignore = [
  "B008",   # FastAPI declares what a route depends on as Depends(...) defaults: that is meant
  "B904",   # an HTTPException raised while handling another error: the client sees the same answer
]
